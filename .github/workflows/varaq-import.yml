name: Import complete VARAQ release
on:
  push:
    paths:
      - '.github/workflows/varaq-import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify full release source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, pathlib, urllib.request, tarfile, tempfile, subprocess, concurrent.futures
          repo = os.environ['GITHUB_REPOSITORY']
          parts = ['3050a267b3e76acdc79499128422b435052dc7d7', '935eaaeaeec592913c4f40f6e14c90a59d70087f', '801712495a42559c2a6c55b282aa8168549ae2a0', 'b99d65be6eec17e3b83c3b05d531a4b77d5874cb', '316aed57ecca93e0e3ac4035f115d108f3e74b0f', '6ac707e9af5bb05d99624488ca14dd45d337fb49', '2a816d632dfc7d07e4cd110bee2a5b625bf17124', 'a1ad653dbca4de79874685c7a6c7ceb154ea2677', '996f2e1500bb0e10390a42c3262d968833b27419', 'c73679526f2837c66be4829d6f4d6118c25c4098', '4114c50f7259f637f4c6b7c5d58c9a2227ef238f', '6ad230994ddacff60f0a38780e0b90270050ae85', 'bc45613ceb7fe73dd6d91f1d23b8db3c37385e2f', '61af8fb96a92356d905f6ad4091a9af108b6ede4', '11d9674f1253e2c2c91e292f6c86794d9978f8b4', 'f9e10d370cf49c43245d33c849999c8efa1b4155', '2ddecee533b7fb4657396d0954c4b8430534bb8c', 'dda13c34c6065951f455d9aecd9e2917018e5bd6', '009c7b84a7392234b0e32713846f0d989aaa3d86', '1cea61a981af72bb95c4dbe2f81992bca7b513e1', '301435801d74e83fdc8425733b84e58f4bf5fb39', 'c355615a6a59182d6ecd7fc4411ec94037d5ee30', '6b6c64ae47e934247c13a0f7a7f80e2e7fa2d80e', '098491cc90e702732f6e5b685840e208cc2dc39f', '9919d1cffa1f59eeecd8a140fb2d842dcc63ef37', 'a023a762408aae32ca9d4f80210f6cc0e30339b8', '285ed1508dfc32fc8c32993313f8c05f0741f5bc', '01f702d14f9301b4dbef7052d439063413d25d1b', '31a1e40f46a5fabd54be4c7f515715c9228eb987', '90a895fb6cefd0190eca9f0e6cca7e0035f4410e', '03d605ba50111feb6f47823e3b9d3766bf28c55d', 'baef75631263e7cef8bf0327fbe7c076647e42c8', '6d05e0c24be1e40ba7a460f1a2e05182c79f77ba', '9da8d6a51c7c23127809be25d74f9834036fe4ca', '8f42cd57f21349c7cb3f2609d0390fadf90ffc68', '561d704a6fcc7d0dcc1ceb7b63f430c57b8ced07', '11cd349ababdcbff04a09798a8fa21b1405ca7c3', 'fe25c2414818d40e1304f1ee53a974a77e6149fc', '40914a8a3a9a5a09dbd7ccb8426a3b2434b451c8']
          expected = '2bb61ecff1e264e7a5acad35555b980ce961ce2225fc49a8ba62530741a1e80f'
          expected_tree = 'a4acf0acb594c4309b1413a75bcaf704f5bb82fe'
          expected_files = 2843
          api = 'https://api.github.com/repos/' + repo + '/git/blobs/'
          def read_part(sha):
              req = urllib.request.Request(api + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  obj = json.load(response)
              content = base64.b64decode(obj['content'])
              actual = hashlib.sha1(('blob %d\0' % len(content)).encode() + content).hexdigest()
              if actual != sha:
                  raise RuntimeError('Transfer part integrity mismatch')
              return content
          with tempfile.TemporaryDirectory() as temporary:
              archive = pathlib.Path(temporary) / 'varaq.tar.gz'
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  with archive.open('wb') as output:
                      for part in pool.map(read_part, parts):
                          output.write(part)
              if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
                  raise RuntimeError('Archive integrity mismatch')
              with tarfile.open(archive, 'r:gz') as tar:
                  members = tar.getmembers()
                  if sum(x.isfile() for x in members) != expected_files:
                      raise RuntimeError('Archive file count mismatch')
                  for member in members:
                      path = pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts or '.git' in path.parts or member.issym() or member.islnk():
                          raise RuntimeError('Unsafe archive member')
                  tar.extractall('.', filter='data')
          pathlib.Path('.github/workflows/varaq-import.yml').unlink()
          subprocess.run(['git','add','--all','--force','--','.'], check=True)
          actual_tree = subprocess.check_output(['git','write-tree']).decode().strip()
          if actual_tree != expected_tree:
              raise RuntimeError('Full source tree mismatch: ' + actual_tree)
          subprocess.run(['git','config','user.name','yaseinmaleki86-blip'], check=True)
          subprocess.run(['git','config','user.email','319982650+yaseinmaleki86-blip@users.noreply.github.com'], check=True)
          subprocess.run(['git','commit','-m','Import VARAQ 9.9.0 full site with 300 illustrated book introductions and summaries'], check=True)
          subprocess.run(['git','push','origin','HEAD:main'], check=True)
          print('Verified full source tree:', actual_tree)
          print('Verified tracked files:', expected_files)
          PY
